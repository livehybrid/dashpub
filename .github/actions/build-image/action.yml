name: Build the dashpub image
description: >
  Build docker/Dockerfile into the local Docker daemon as dashpub-e2e:latest,
  retrying when the registry rate limits the base image pull.

# The base image comes from a public registry that rate limits per runner IP
# and now and then answers "429 Too Many Requests". That is not a test result,
# and a pull request must not go red (or a Dependabot update fail to merge)
# because of it. Three attempts, 45 s and 120 s apart.

inputs:
  no-cache:
    description: Build without any cache.
    default: 'false'
  cache-to:
    description: Where to write the build cache (empty writes none).
    default: ''

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build (attempt 1)
      id: first
      continue-on-error: true
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./docker/Dockerfile
        load: true
        tags: dashpub-e2e:latest
        provenance: false
        no-cache: ${{ inputs.no-cache }}
        cache-from: type=gha,scope=dashpub-image
        cache-to: ${{ inputs.cache-to }}

    - name: Wait before attempt 2
      if: steps.first.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Image build retried::Attempt 1 failed (often a registry rate limit). Retrying in 45 s."
        sleep 45

    - name: Build (attempt 2)
      id: second
      if: steps.first.outcome == 'failure'
      continue-on-error: true
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./docker/Dockerfile
        load: true
        tags: dashpub-e2e:latest
        provenance: false
        no-cache: ${{ inputs.no-cache }}
        cache-from: type=gha,scope=dashpub-image
        cache-to: ${{ inputs.cache-to }}

    - name: Wait before attempt 3
      if: steps.second.outcome == 'failure'
      shell: bash
      run: sleep 120

    - name: Build (attempt 3)
      if: steps.second.outcome == 'failure'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./docker/Dockerfile
        load: true
        tags: dashpub-e2e:latest
        provenance: false
        no-cache: ${{ inputs.no-cache }}
        cache-from: type=gha,scope=dashpub-image
        cache-to: ${{ inputs.cache-to }}
